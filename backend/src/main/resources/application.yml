server:
  port: ${PORT:8080}

spring:
  application:
    name: internship-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/internship_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours
  upload:
    dir: ${UPLOAD_DIR:uploads/resumes}
  scheduler:
    cron: "0 0 * * * ?" # Every hour at minute 0
    zone: "Asia/Kolkata"
  matching:
    min-threshold: 30 # Minimum match percentage to show

logging:
  level:
    com.tilak.internship_platform: INFO
    org.springframework.security: WARN
